<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Saad Atique</title>
<meta name="description" content="Muhammad Saad Atique — Robotics Enthusiast & Web Developer">
<style>
  :root {
    --bg: #0b0d10;
    --fg: #f2f0ea;
    --accent: #5eead4;
    --muted: #8b9199;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  .wrap {
    text-align: center;
    max-width: 640px;
  }

  .eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.1s;
    font-variant-numeric: tabular-nums;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.25s;
  }

  p.tagline {
    margin-top: 16px;
    font-size: clamp(1rem, 2.4vw, 1.15rem);
    color: var(--muted);
    font-weight: 400;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.4s;
  }

  .status {
    margin-top: 40px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--muted);
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.55s;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(94, 234, 212, 0.5);
    animation: pulse 2s infinite;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(94, 234, 212, 0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(94, 234, 212, 0); }
    100% { box-shadow: 0 0 0 0 rgba(94, 234, 212, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow, h1, p.tagline, .status { animation: none; opacity: 1; }
    .dot { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Week 04 · Empty but live</div>
    <h1>Muhammad Saad Atique</h1>
    <p class="tagline">Robotics Enthusiast &amp; Web Developer</p>
    <div class="status"><span class="dot"></span> This page is live. Everything else comes next.</div>
  </div>
</body>
</html>
